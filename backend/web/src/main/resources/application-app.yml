morningstar:
  app:
    site:
      domain: morningstar369.com
      admin-email: ${MAIL_ADMIN_ACCOUNT}
    blog:
      description: "Dev & Life"
      root-path: "/blog"
      rss-title: "Morningstar Blog RSS Feed"
      atom-title: "Morningstar Blog Atom Feed"
      excerpt-max-sentence-num: 40
      excerpt-max-visual-length: 300
    dev:
      in-scope-severities:
        sonar: [ BLOCKER, HIGH, MEDIUM ]
        ai: [ BLOCKER, HIGH, MEDIUM, LOW ]
      git:
        fix-branch-prefix: "fix/"
      gitea:
        bot-username: HaibaraAi369
        bot-email: jeep.jipu@outlook.com
      max-attempts:
        sync: 10
        scan: 10
        fix: 10
        verify: 10
        submit: 10
      schedule:
        create-cron: "0 0 21 * * ?"
        dispatch-cron: "*/30 * * * * ?"
        timeout-cron: "0 */5 * * * ?"
        cleanup-cron: "0 0 6 * * ?"
        sync-pr-status-cron: "30 */5 * * * ?"
        run-timeout-minutes: 120
        max-concurrency: 2
      sandbox:
        image: morningstar-dev-sandbox:latest
        container-name-prefix: morningstar_dev_sandbox_
        volume-name-prefix: morningstar_dev_repo_
      claude-code:
        model-api-key: ${DEEPSEEK_API_KEY}