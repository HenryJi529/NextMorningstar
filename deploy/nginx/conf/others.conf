upstream beancount {
    server 127.0.0.1:5001;
}
upstream code {
    server 127.0.0.1:5299;
}
upstream frps {
    server 127.0.0.1:7500;
}
upstream jellyfin {
    server 127.0.0.1:8096;
}
upstream sshwifty {
    server 127.0.0.1:8182;
}
upstream gitea {
    server 127.0.0.1:7001;
}
upstream sonarqube {
    server 127.0.0.1:7002;
}


server {
    listen 80;
    server_name beancount.morningstar369.com;

    auth_basic "Please Login";
    # htpasswd -Bbc -C10 beancount.htpasswd xxxx xxxx
    auth_basic_user_file /etc/nginx/htpasswd/beancount.htpasswd; 

    location / {
        proxy_pass http://beancount;

        include snippets/proxy-headers.conf;
    }
}

server {
    listen 80;
    server_name code.morningstar369.com;
    location / {
        proxy_pass http://code;

        include snippets/websocket.conf;
        include snippets/proxy-headers.conf;

        proxy_read_timeout 86400s;
        proxy_send_timeout 60s;
    }
}

server {
    listen 80;
    server_name frps.morningstar369.com;
    location / {
        proxy_pass http://frps;

        include snippets/proxy-headers.conf;
    }
}

server {
    listen 80;
    client_max_body_size 200m;
    server_name jellyfin.morningstar369.com;
    location / {
        proxy_pass http://jellyfin;

        include snippets/websocket.conf;
        include snippets/proxy-headers.conf;
    }
}

server {
    listen 80;
    server_name sshwifty.morningstar369.com;

    include snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    server_name sshwifty.morningstar369.com;

    # NOTE: 证书首次获取 certbot certonly --standalone -d sshwifty.morningstar369.com
    ssl_certificate /etc/letsencrypt/live/sshwifty.morningstar369.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sshwifty.morningstar369.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://sshwifty;

        include snippets/websocket.conf;
        include snippets/proxy-headers.conf;

        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}

server {
    listen 80;
    client_max_body_size 200m;
    server_name gitea.morningstar369.com;
    location / {
        proxy_pass http://gitea;

        include snippets/proxy-headers.conf;
    }
}

server {
    listen 80;
    client_max_body_size 200m;
    server_name sonarqube.morningstar369.com;
    location / {
        proxy_pass http://sonarqube;

        include snippets/proxy-headers.conf;
    }
}
