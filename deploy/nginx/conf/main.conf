server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on; # SNI 不匹配任何已配置域名时直接拒绝 TLS 握手
}

server {
    listen 80;
    server_name morningstar369.com;
    charset utf-8;
    client_max_body_size 134M;
    error_log /var/log/nginx/error.log warn;

    gzip on; # 启用 gzip 压缩
    gzip_vary on; # 在响应头中添加 Vary: Accept-Encoding
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1k;
    gzip_comp_level 5;

    location = /gfw {
        proxy_pass https://nthack.github.io/Shadowrocket-ADBlock-Rules-Easy/sr_banlist_manual.conf;
        proxy_ssl_server_name on; # 把上游的域名放进 SNI
    }

    location ^~ /api/docs/ {
        return 404;
    }

    location ^~ /api/ws/ {
        proxy_pass http://127.0.0.1:8091/ws/; # 不用rewrite避免握手被破坏

        include snippets/websocket.conf;

        proxy_buffering off; # 流式语义，保留 SockJS 的回退能力
        proxy_read_timeout 86400s;
        proxy_send_timeout 60s;

        include snippets/proxy-headers.conf;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8091;
        rewrite ^/api/(.*)$ /$1 break;

        include snippets/proxy-headers.conf;
    }

    location ^~ /assets/ {
        alias /etc/nginx/www/morningstar/assets/;
        
        expires 1y;
        add_header Cache-Control "public, immutable";
        gzip_static on;  # 启用预压缩
        
        access_log off;
    }

    location ^~ /media/ {
        alias /etc/nginx/www/morningstar/media/;

        add_header Cache-Control "public, max-age=86400";
        expires 1d;
        if_modified_since off; # 关闭时间戳验证
        etag on; # 启用内容hash验证

        access_log off;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        root /etc/nginx/www/morningstar;
        try_files $uri $uri/ /index.html;
    }
}

