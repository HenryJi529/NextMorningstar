server {
    listen 80;
    server_name njcb-aml.morningstar369.com;

    include snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    server_name njcb-aml.morningstar369.com;

    # NOTE: 证书签发/续期 certbot certonly --webroot -w /var/www/html -d njcb-aml.morningstar369.com
    ssl_certificate /etc/letsencrypt/live/njcb-aml.morningstar369.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/njcb-aml.morningstar369.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        root /etc/nginx/www/njcb-aml;
        index index.html;
    }
}